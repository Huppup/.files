
# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################


# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,auto
xwayland {
    force_zero_scaling = true
}
env = GDK_BACKEND, wayland
env = GDK_SCALE, 1.5

###################
## MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

#Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
exec-once = waybar
# exec-once = hyprpaper
exec-once = swww-daemon
exec-once = swww img ~/Pictures/ShiningLinux.gif


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,16
env = HYPRCURSOR_SIZE,16


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general { 
    gaps_in = 7
    gaps_out = 18

    border_size = 3

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    # Yellow/Green
#    col.active_border = rgba(f5c73dee) rgba(d0f53dee) 45deg
    #Yellow/Pink
    #col.active_border = rgba(f5c73dee) rgba(fd4133ee) 45deg
    #Pink/Purple
#    col.active_border = rgba(d997c8ee) rgba(7366dfee) 45deg
    #Purple/Blue
#    col.active_border=  rgba(b366afee) rgba(3446cfee) 45deg
    #Yellow/Soft purple
#col.active_border = rgba(f5c73dee) rgba(c3227dee) 45deg
    #Yellow/Brown
#    col.active_border = rgba(f8d851ee) rgba(40250dee) 45deg
    #DarkGreen/DarkYellow
#    col.active_border = rgba(206203ee) rgba(66440dee) 45deg
    #Yellow/Green Gray
#    col.active_border = rgba(d8c32fee) rgba(2d312dee) 45deg
    #Green/Gray
#    col.active_border = rgba(7aa90dee) rgba(2d312dee) 45deg
    #Green/Green
    #col.active_border = rgba(7aa90dee) rgba(68862aee) 45deg
    #Golden Palette
    col.active_border = rgba(f29b14ee) rgba(fff883ee) rgba(d26e0aee) rgba(b64701ee) rgba(632600ee) rgba(8c3600ee) 45deg

   col.inactive_border = rgba(63260077)
#    col.inactive_border = rgba(894949cc)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false 

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 7

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.95

    dim_inactive = true
    dim_strength = 0.3
#    drop_shadow = true
#shadow_range = 4
#    shadow_render_power = 3
#    col.shadow = rgba(1a1a1aee)

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1
        
        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = Bez, 0.05, 0.1, 0.001, 0.8

    animation = windows, 1, 7, myBezier, slide top
    
    #animation = windowsOut, 1, 9, default, popin 80%
    #animation = windowsOut, 1, 9, myBezier, slide bottom
    animation = windowsOut, 1, 7, default, slide bottom
    animation = border, 1, 10, default
    animation = borderangle, 1, 1, default, once
    #animation = borderangle, 1, 10, Bez, loop
    animation = fade, 1, 7, default
    #animation = workspacesOut, 1, 5, default, slide
    animation = workspaces, 1, 8, default, slide
    animation = specialWorkspaceIn, 1, 4, default, slidevert
    animation = specialWorkspaceOut, 1, 10, default, slidefadevert
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        scroll_factor = 0.45
        disable_while_typing = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = false
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = 0
}


####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, B, exec, flatpak run app.zen_browser.zen
bind = $mainMod, K, killactive,
bind = $mainMod, L, exit,
bind = $mainMod, M, exec, flatpak run com.spotify.Client
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
#bind = $mainMod, D, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, G, exec, flatpak run com.valvesoftware.Steam
bind = $mainMod, U, exec, flatpak run app/org.gimp.GIMP/x86_64/stable
bind = $mainMod, SPACE, exec, $menu
#Wofi reconfigurator
bind = $mainMod, SPACE, exec, ~/.config/wofi/a.out
bind = $mainMod, SPACE, exec, mv ~/config ~/.config/wofi/config

#Ricing refresh
bind = $mainMod, W, exec, waybar
bind = $mainMod SHIFT, W, exec, killall waybar
# bind = $mainMod, P, exec, hyprpaper 
# bind = $mainMod SHIFT, P, exec, killall hyprpaper
bind = $mainMod, P, exec, swww img ~/Pictures/ShiningLinux.gif
bind = $mainMod SHIFT, P, exec, swww img ~/Pictures/lin.png

#new workspace window

# Change Sound and Brightness
bind = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = ,XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = ,XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = ,XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, A, workspace, e-1
bind = $mainMod, D, workspace, e+1

# bind = $mainMod, 1, execr, hyprctl hyprpaper reload ,"~/Pictures/CodeWall/image1.png"
# bind = $mainMod, 2, execr, hyprctl hyprpaper reload ,"~/Pictures/CodeWall/image2.png"
# bind = $mainMod, 3, execr, hyprctl hyprpaper reload ,"~/Pictures/CodeWall/image3.png"
# bind = $mainMod, 4, execr, hyprctl hyprpaper reload ,"~/Pictures/CodeWall/image4.png"
# bind = $mainMod, 5, execr, hyprctl hyprpaper reload ,"~/Pictures/CodeWall/image5.png"
# bind = $mainMod, 6, execr, hyprctl hyprpaper reload ,"~/Pictures/CodeWall/image6.png"
# bind = $mainMod, 7, execr, hyprctl hyprpaper reload ,"~/Pictures/CodeWall/image7.png"
# bind = $mainMod, 8, execr, hyprctl hyprpaper reload ,"~/Pictures/CodeWall/image8.png"
# bind = $mainMod, 9, execr, hyprctl hyprpaper reload ,"~/Pictures/CodeWall/image9.png"
#bind = $mainMod, 0, execr, hyprctl hyprpaper reload ,"~/Pictures/CodeWall/image10.png"


# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.
